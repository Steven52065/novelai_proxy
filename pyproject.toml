[project]
name = "novelai-proxy"
version = "0.1.0"
description = "NovelAI API proxy service with shared-user auth, queueing, rate limits, quota tracking, and admin UI."
readme = "REQUIREMENTS.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0.1",
    "curl-cffi>=0.11.3",
    "httpx>=0.26.0",
    "pillow>=10.2.0",
    "argon2-cffi>=23.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
]

[tool.uv]
package = false
