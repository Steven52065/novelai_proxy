<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}NovelAI Proxy Admin Panel{% endblock %}</title>
  <!-- PWA -->
  <link rel="manifest" href="/static/manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#060813">
  <meta name="msapplication-TileColor" content="#060813">
  <link rel="stylesheet" href="{{ static_url('style.css') }}">
  {% block head_extra %}{% endblock %}
</head>
<body class="{{ active|default('admin') }}-page">
  <header class="topbar">
    <a class="brand" href="/admin">
      <i data-lucide="sparkles" style="width: 22px; height: 22px; stroke: #a5b4fc;"></i>
      NovelAI Proxy
    </a>
    <nav class="topbar-nav">
      <a class="{{ 'active' if active == 'dashboard' else '' }}" href="/admin">
        <i data-lucide="layout-dashboard" style="width: 16px; height: 16px;"></i>仪表盘
      </a>
      <a class="{{ 'active' if active == 'users' else '' }}" href="/admin/users">
        <i data-lucide="users" style="width: 16px; height: 16px;"></i>用户管理
      </a>
      <a class="{{ 'active' if active == 'user_groups' else '' }}" href="/admin/user-groups">
        <i data-lucide="users-round" style="width: 16px; height: 16px;"></i>用户组
      </a>
      <a class="{{ 'active' if active == 'logs' else '' }}" href="/admin/logs">
        <i data-lucide="history" style="width: 16px; height: 16px;"></i>使用日志
      </a>
      <a class="{{ 'active' if active == 'upstreams' else '' }}" href="/admin/upstreams">
        <i data-lucide="key-round" style="width: 16px; height: 16px;"></i>上游账号
      </a>
      <a class="{{ 'active' if active == 'database' else '' }}" href="/admin/database">
        <i data-lucide="database" style="width: 16px; height: 16px;"></i>数据库管理
      </a>
    </nav>
    <form method="post" action="/admin/logout">
      <button class="link-button" type="submit">
        <i data-lucide="log-out" style="width: 16px; height: 16px;"></i>退出登录
      </button>
    </form>
  </header>

  <main class="page">
    {% block content %}{% endblock %}
  </main>

  <!-- 移动端底部标签栏（PC 隐藏，≤768px 显示） -->
  <nav class="bottom-nav" aria-label="主导航">
    <a class="{{ 'active' if active == 'dashboard' else '' }}" href="/admin">
      <i data-lucide="layout-dashboard"></i>仪表盘
    </a>
    <a class="{{ 'active' if active == 'users' else '' }}" href="/admin/users">
      <i data-lucide="users"></i>用户
    </a>
    <a class="{{ 'active' if active == 'user_groups' else '' }}" href="/admin/user-groups">
      <i data-lucide="users-round"></i>用户组
    </a>
    <a class="{{ 'active' if active == 'logs' else '' }}" href="/admin/logs">
      <i data-lucide="history"></i>日志
    </a>
    <a class="{{ 'active' if active == 'upstreams' else '' }}" href="/admin/upstreams">
      <i data-lucide="key-round"></i>上游
    </a>
    <a class="{{ 'active' if active == 'database' else '' }}" href="/admin/database">
      <i data-lucide="database"></i>数据库
    </a>
  </nav>

  <!-- Global Lightbox for Image Previews -->
  <div id="global-lightbox" class="lightbox">
    <div class="lightbox-content">
      <span class="lightbox-close"><i data-lucide="x" style="width: 20px; height: 20px;"></i></span>
      <img id="global-lightbox-img" src="" alt="Base64 Preview">
    </div>
  </div>

  <div id="admin-notification-overlay" class="admin-notification-overlay" hidden></div>
  <div id="admin-notification-modal" class="admin-notification-modal" role="dialog" aria-modal="true" aria-labelledby="admin-notification-title" hidden>
    <div class="admin-notification-card">
      <div class="admin-notification-head">
        <i data-lucide="alert-triangle" class="admin-notification-icon"></i>
        <h2 id="admin-notification-title"></h2>
      </div>
      <p id="admin-notification-content" class="admin-notification-content"></p>
      <div id="admin-notification-time" class="admin-notification-time"></div>
      <div class="admin-notification-actions">
        <button id="admin-notification-close" type="button" class="secondary">关闭</button>
        <button id="admin-notification-dismiss" type="button">不再提醒</button>
      </div>
    </div>
  </div>

  <div id="confirm-dialog-modal" class="admin-notification-modal confirm-dialog-modal" role="dialog" aria-modal="true" aria-labelledby="confirm-dialog-title" hidden>
    <div id="confirm-dialog-card" class="admin-notification-card confirm-dialog-card">
      <div class="admin-notification-head">
        <i id="confirm-dialog-icon" data-lucide="circle-help" class="admin-notification-icon"></i>
        <h2 id="confirm-dialog-title">确认操作</h2>
      </div>
      <p id="confirm-dialog-message" class="admin-notification-content"></p>
      <div class="admin-notification-actions">
        <button id="confirm-dialog-cancel" type="button" class="secondary">取消</button>
        <button id="confirm-dialog-ok" type="button">确认</button>
      </div>
    </div>
  </div>

  <!-- Lucide Icons Library -->
  <script src="{{ static_url('vendor/lucide.min.js') }}"></script>
  
  <script>
    // Initialize Lucide Icons
    lucide.createIcons();

    // Global Toast Notification
    function showToast(message, type = 'info') {
      const variants = {
        info: {icon: 'info'},
        success: {icon: 'check-circle-2'},
        error: {icon: 'alert-circle'},
      };
      const variant = variants[type] || variants.info;
      let toast = document.getElementById('global-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'global-toast';
        toast.className = 'toast-msg';
        toast.innerHTML = '<i class="toast-icon" style="width: 18px; height: 18px;"></i><span class="toast-text"></span>';
        document.body.appendChild(toast);
      }
      toast.className = `toast-msg toast-${type}`;
      toast.querySelector('.toast-icon').setAttribute('data-lucide', variant.icon);
      toast.querySelector('.toast-text').textContent = message;
      toast.classList.add('show');
      
      // Dynamic Lucide update for injected markup
      lucide.createIcons();
      
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }

    const confirmDialogModal = document.getElementById('confirm-dialog-modal');
    const confirmDialogCard = document.getElementById('confirm-dialog-card');
    const confirmDialogIcon = document.getElementById('confirm-dialog-icon');
    const confirmDialogMessage = document.getElementById('confirm-dialog-message');
    const confirmDialogCancel = document.getElementById('confirm-dialog-cancel');
    const confirmDialogOk = document.getElementById('confirm-dialog-ok');
    let confirmDialogResolve = null;

    function closeConfirmDialog(result) {
      confirmDialogModal.hidden = true;
      const resolve = confirmDialogResolve;
      confirmDialogResolve = null;
      if (resolve) {
        resolve(result);
      }
    }

    function confirmDialog(message, options = {}) {
      if (confirmDialogResolve) {
        closeConfirmDialog(false);
      }
      confirmDialogMessage.textContent = message;
      confirmDialogCard.classList.toggle('danger', Boolean(options.danger));
      confirmDialogIcon.setAttribute('data-lucide', options.danger ? 'alert-triangle' : 'circle-help');
      confirmDialogOk.className = options.danger ? 'danger' : '';
      confirmDialogOk.textContent = options.confirmText || '确认';
      confirmDialogCancel.textContent = options.cancelText || '取消';
      confirmDialogModal.hidden = false;
      lucide.createIcons();
      confirmDialogOk.focus();
      return new Promise((resolve) => {
        confirmDialogResolve = resolve;
      });
    }

    function confirmSubmit(event, message, options = {}) {
      const form = event.currentTarget;
      if (form.dataset.confirmed === 'true') {
        delete form.dataset.confirmed;
        form.dataset.loadingConfirmed = 'true';
        return true;
      }
      event.preventDefault();
      confirmDialog(message, options).then((confirmed) => {
        if (!confirmed) return;
        form.dataset.confirmed = 'true';
        form.requestSubmit();
      });
      return false;
    }

    confirmDialogCancel.addEventListener('click', () => closeConfirmDialog(false));
    confirmDialogOk.addEventListener('click', () => closeConfirmDialog(true));
    confirmDialogModal.addEventListener('click', (event) => {
      if (event.target === confirmDialogModal) {
        closeConfirmDialog(false);
      }
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && !confirmDialogModal.hidden) {
        closeConfirmDialog(false);
      }
    });

    // Lightbox for Base64 Preview Setup
    const lightbox = document.getElementById('global-lightbox');
    const lightboxClose = document.querySelector('#global-lightbox .lightbox-close');
    
    if (lightboxClose) {
      lightboxClose.addEventListener('click', () => {
        lightbox.classList.remove('show');
      });
    }
    
    if (lightbox) {
      lightbox.addEventListener('click', (e) => {
        if (e.target.id === 'global-lightbox') {
          lightbox.classList.remove('show');
        }
      });
    }

    function previewBase64Image(base64Data) {
      const img = document.getElementById('global-lightbox-img');
      img.src = base64Data;
      lightbox.classList.add('show');
    }

    // Admin notifications
    const adminNotificationOverlay = document.getElementById('admin-notification-overlay');
    const adminNotificationModal = document.getElementById('admin-notification-modal');
    const adminNotificationTitle = document.getElementById('admin-notification-title');
    const adminNotificationContent = document.getElementById('admin-notification-content');
    const adminNotificationTime = document.getElementById('admin-notification-time');
    const adminNotificationClose = document.getElementById('admin-notification-close');
    const adminNotificationDismiss = document.getElementById('admin-notification-dismiss');
    const adminNotificationQueue = [];
    let currentAdminNotification = null;

    function hideAdminNotification() {
      adminNotificationOverlay.hidden = true;
      adminNotificationModal.hidden = true;
      currentAdminNotification = null;
    }

    function showNextAdminNotification() {
      if (currentAdminNotification || adminNotificationQueue.length === 0) {
        return;
      }
      currentAdminNotification = adminNotificationQueue.shift();
      adminNotificationTitle.textContent = currentAdminNotification.title || '后台事件';
      adminNotificationContent.textContent = currentAdminNotification.content || '';
      adminNotificationTime.textContent = currentAdminNotification.event_time_display || currentAdminNotification.event_time || '';
      adminNotificationOverlay.hidden = false;
      adminNotificationModal.hidden = false;
      lucide.createIcons();
    }

    function closeAdminNotification() {
      hideAdminNotification();
      showNextAdminNotification();
    }

    async function dismissAdminNotification() {
      if (!currentAdminNotification) {
        return;
      }
      const notification = currentAdminNotification;
      adminNotificationDismiss.disabled = true;
      try {
        const response = await fetch(`/admin/api/notifications/${notification.id}/dismiss`, {
          method: 'POST',
          credentials: 'same-origin'
        });
        if (!response.ok) {
          showToast('通知状态更新失败', 'error');
          return;
        }
        closeAdminNotification();
      } catch (error) {
        showToast('通知状态更新失败', 'error');
      } finally {
        adminNotificationDismiss.disabled = false;
      }
    }

    async function loadAdminNotifications() {
      try {
        const response = await fetch('/admin/api/notifications/pending', {credentials: 'same-origin'});
        if (!response.ok) {
          return;
        }
        const data = await response.json();
        adminNotificationQueue.push(...(data.notifications || []));
        showNextAdminNotification();
      } catch (error) {
        // Ignore notification fetch failures; normal page actions should continue.
      }
    }

    if (adminNotificationClose && adminNotificationDismiss) {
      adminNotificationClose.addEventListener('click', closeAdminNotification);
      adminNotificationDismiss.addEventListener('click', dismissAdminNotification);
      loadAdminNotifications();
    }
  </script>
  <!-- PWA Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/static/sw.js');
    }
  </script>
</body>
</html>
