<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>管理员登录 - NovelAI Proxy</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-page">
  <main class="login-panel">
    <div style="display: flex; flex-direction: column; align-items: center; margin-bottom: 24px;">
      <div style="width: 56px; height: 56px; border-radius: 99px; background: rgba(99, 102, 241, 0.15); border: 1px solid rgba(99, 102, 241, 0.3); display: flex; align-items: center; justify-content: center; margin-bottom: 16px; box-shadow: 0 0 20px rgba(99, 102, 241, 0.2);">
        <i data-lucide="shield-check" style="width: 28px; height: 28px; stroke: #a5b4fc;"></i>
      </div>
      <h1>管理员登录</h1>
      <p class="login-subtitle">请验证您的管理员凭证以访问控制台</p>
    </div>

    {% if error %}
    <div class="error">
      <div style="display: flex; align-items: center; gap: 8px;">
        <i data-lucide="alert-triangle" style="width: 18px; height: 18px;"></i>
        <span>{{ error }}</span>
      </div>
    </div>
    {% endif %}

    <form method="post" action="/admin/login" class="stack">
      <label>
        <span>用户名</span>
        <div style="position: relative; display: flex; align-items: center;">
          <i data-lucide="user" style="position: absolute; left: 14px; width: 16px; height: 16px; color: #64748b;"></i>
          <input name="username" autocomplete="username" placeholder="请输入管理员用户名" required style="padding-left: 42px;">
        </div>
      </label>
      
      <label>
        <span>密码</span>
        <div style="position: relative; display: flex; align-items: center;">
          <i data-lucide="lock" style="position: absolute; left: 14px; width: 16px; height: 16px; color: #64748b;"></i>
          <input name="password" type="password" autocomplete="current-password" placeholder="请输入管理员密码" required style="padding-left: 42px;">
        </div>
      </label>
      
      <button type="submit" style="margin-top: 10px; width: 100%;">
        <i data-lucide="log-in" style="width: 18px; height: 18px;"></i>
        确认登录
      </button>
    </form>
  </main>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
