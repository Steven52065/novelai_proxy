<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>管理员登录 - NovelAI Proxy</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-page">
  <main class="login-panel">
    <div class="login-hero">
      <div class="login-logo">
        <i data-lucide="shield-check" class="icon-28"></i>
      </div>
      <h1>管理员登录</h1>
      <p class="login-subtitle">请验证您的管理员凭证以访问控制台</p>
    </div>

    {% if error %}
    <div class="error">
      <div class="error-row">
        <i data-lucide="alert-triangle" class="btn-icon-lg"></i>
        <span>{{ error }}</span>
      </div>
    </div>
    {% endif %}

    <form method="post" action="/admin/login" class="stack">
      <label>
        <span>用户名</span>
        <div class="field-with-icon">
          <i data-lucide="user" class="field-icon"></i>
          <input name="username" autocomplete="username" placeholder="请输入管理员用户名" required>
        </div>
      </label>

      <label>
        <span>密码</span>
        <div class="field-with-icon">
          <i data-lucide="lock" class="field-icon"></i>
          <input name="password" type="password" autocomplete="current-password" placeholder="请输入管理员密码" required>
        </div>
      </label>

      <button type="submit" class="btn-block btn-mt-sm">
        <i data-lucide="log-in" class="btn-icon-lg"></i>
        确认登录
      </button>
    </form>
  </main>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
