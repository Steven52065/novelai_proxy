<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>自助注册 - NovelAI Proxy</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-page">
  <main class="login-panel">
    <div class="login-hero">
      <div class="login-logo login-logo-discord">
        <i data-lucide="message-circle" class="icon-28"></i>
      </div>
      <h1>自助注册</h1>
      <p class="login-subtitle">使用 Discord 登录后领取本项目 API Key</p>
    </div>

    <a href="/auth/discord/start" class="btn-block-link">
      <button type="button" class="btn-block">
        <i data-lucide="log-in" class="btn-icon-lg"></i>
        使用 Discord 登录
      </button>
    </a>
  </main>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
