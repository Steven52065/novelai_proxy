<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>自助注册 - NovelAI Proxy</title>
  <!-- PWA -->
  <link rel="manifest" href="/static/manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#060813">
  <meta name="msapplication-TileColor" content="#060813">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-page">
  <main class="login-panel">
    <div class="login-hero">
      <div class="login-logo login-logo-discord">
        <i data-lucide="message-circle" class="icon-28"></i>
      </div>
      <h1>自助注册</h1>
      <p class="login-subtitle">使用 Discord 登录后领取本项目 API Key</p>
    </div>

    <a href="/auth/discord/start" class="btn-block-link">
      <button type="button" class="btn-block">
        <i data-lucide="log-in" class="btn-icon-lg"></i>
        使用 Discord 登录
      </button>
    </a>
  </main>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    lucide.createIcons();
  </script>
  <!-- PWA Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/static/sw.js');
    }
  </script>
</body>
</html>
