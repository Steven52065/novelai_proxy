# NovelAI Proxy 配置模板。
# 使用方式：复制为 config.yaml，并填写管理后台密码等本地配置；NovelAI Token 在管理后台维护。
# 注意：config.yaml 已被 .gitignore 忽略，不要把真实密钥、密码或运行数据库提交到 Git。

# 管理后台登录配置。
# 管理后台地址通常是 http://127.0.0.1:8080/admin 。
admin:
  # 管理后台用户名。
  username: admin
  # 管理后台密码。生产或公网环境必须修改为强密码。
  password: change-me

# FastAPI 服务监听配置。
server:
  # 监听地址。
  # 0.0.0.0 表示监听所有网卡，局域网或反向代理可访问。
  # 如果只允许本机访问，可改为 127.0.0.1。
  host: 0.0.0.0
  # 监听端口。
  port: 8080

# 上游 NovelAI 请求队列配置。
# 项目会把用户请求先放入本地调度队列，再按 routing 规则转交到某个上游 key 的独立队列。
# 每个上游 key 拥有自己的串行队列和延时状态，用于避免多个请求同时打到同一个上游账号。
queue:
  # 每个上游 key 的本地等待队列最大长度。超过后调度层会尝试该用户允许的其他上游；
  # 如果全部允许的上游队列都满，新请求会返回 503。
  max_queue_size: 50
  # 调度队列最大长度。留空时默认等于 max_queue_size * 已启用上游 key 数量。
  # 该队列位于用户请求入口和各上游独立队列之间，用于避免突发请求无限堆积。
  dispatch_max_queue_size:
  # 相邻两次发往 NovelAI 上游请求之间的随机间隔范围，单位秒。
  # 每次请求都会在 min 和 max 之间随机选择一个间隔；两者相同则为固定间隔。
  upstream_interval_min_seconds: 2
  upstream_interval_max_seconds: 5
  # 如果上一个上游请求返回 API 报错，则下一次请求在随机队列间隔基础上额外等待的秒数。
  upstream_error_extra_delay_seconds: 5
  # 单个上游请求的最大执行时长，单位秒。
  # 只统计等待 NovelAI 上游返回内容的时间；不包含本地排队、随机间隔或错误后的额外等待。
  upstream_execution_timeout_seconds: 60
  # 429 错误自动重试的队列长度阈值。
  # 当上游返回 429 错误时，如果当前所有上游子队列的排队请求数小于等于该值，请求会回到调度层按 routing 策略重新调度。
  # 这个计数只包含已经分配到具体上游、但尚未运行的请求；不包含调度队列中的请求，也不包含正在运行的请求。
  # 普通用户的 429 重试会作为新的调度项重新排队；VIP 用户仍保持优先级，并在分配到上游后排到该上游队列最前端。
  # 设置为 0 表示只有所有上游子队列都没有等待请求时才重试；设置为 -1 表示禁用 429 自动重试功能。
  retry_429_queue_length_threshold: 3
  # 429 错误自动重试的最大尝试次数（包括初次尝试）。
  # 例如设置为 5，表示初次尝试 + 最多 4 次重试。
  retry_429_max_attempts: 5

# 调度层分流配置。
routing:
  # round_robin：在用户允许的上游 key 中轮询。
  # random：在用户允许的上游 key 中随机尝试。
  # adaptive_weighted_random：根据上游近期成功/失败结果动态调整权重，再按权重随机分配。
  #   该策略只影响进入生成队列的上游分流；suggest-tags 等不进入队列的查询接口仍按固定顺序选择用户允许的上游。
  #   上游请求成功会提高该上游分数，失败或 429 会降低该上游分数。
  #   不会熔断上游，也不会把某个上游完全移出候选；低分上游仍会保留少量流量，方便短时占用恢复后自然升权。
  strategy: round_robin
  adaptive:
    # 初始健康分。服务启动后没有历史记录时，每个上游都会使用该分数。
    # 取值范围 0.0 ~ 1.0；值越高表示启动时越信任所有上游。
    # 因为所有上游初始值相同，所以刚启动时各上游流量比例仍接近均匀。
    initial_score: 0.8
    # EWMA 更新系数，也就是最近一次请求结果对分数的影响强度。
    # 取值范围 0.0 ~ 1.0；越大越敏感，短时失败会更快降权，恢复成功也会更快升权。
    # 例如 alpha=0.4 时，旧分 0.8 失败一次会变为 0.48；随后成功一次会恢复到 0.688。
    # NovelAI 上游 429 往往只是短时间被占用，建议使用 0.3 ~ 0.5 这种偏短记忆的值。
    alpha: 0.4
    # 最小权重。最终抽样权重为 min_weight + score。
    # 该值保证上游即使近期一直失败，也不会完全没有流量，避免恢复后长期无法被重新探测到。
    # 值越大，低分上游保留的流量越多；值越小，成功率高的上游获得的流量倾斜越明显。
    min_weight: 0.15

# NovelAI 上游账号和计费设置在管理后台维护：
# http://127.0.0.1:8080/admin/upstreams
# config.yaml 中不再支持 novelai: 配置段。

# 上游错误自动禁用配置。
# 当某个 NovelAI 上游账号返回指定 HTTP 状态码时，会自动把该账号设为禁用，
# 并把该账号队列里尚未开始执行的普通用户请求退回调度队列重新分流。
upstream_auto_disable:
  # 默认开启。关闭后只记录正常失败，不会自动修改上游账号启用状态。
  enabled: true
  # 默认 403，通常表示 API Key 或账号状态不可用。
  status_codes:
    - 403

# SQLite 数据库配置。
database:
  # 运行数据库路径。默认会在项目根目录生成 novelai_proxy.db。
  # 该文件以及对应的 .db-shm / .db-wal 已被忽略，不要提交。
  path: novelai_proxy.db
  # 自动 VACUUM 配置。执行前后会截断 WAL 文件，实际释放磁盘空间。
  auto_vacuum:
    # 默认开启；如果希望只通过管理后台手动执行，可改为 false。
    enabled: true
    # 每日执行时间，按固定 UTC+8 时区计算，格式 HH:MM。
    run_time_utc8: "04:00"
  # 新写入 usage_logs.request_payload 的热存储压缩配置。
  # 默认关闭；开启后会先把 JSON minify，达到阈值且 zlib 至少节省指定比例时存为 BLOB。
  # 冷归档 payload_archive 仍是长期存储压缩机制。
  hot_payload:
    enabled: false
    compression: zlib
    compression_level: 6
    min_bytes: 4096
    min_savings_ratio: 0.10
  # usage_logs.request_payload 归档配置。
  # 默认关闭自动归档；管理后台的手动归档按钮始终可用。
  payload_archive:
    enabled: false
    # 保留最近多少天的热数据。归档按 UTC+8 自然日保守计算，不处理当天或边界日部分数据。
    hot_days: 7
    compression: zlib
    compression_level: 6
    max_payloads_per_part: 1000
    max_raw_bytes_per_part: 33554432
    run_interval_hours: 24
    max_rows_per_run: 10000

# 免费小图每日数量限制配置。
free_small_daily_limit:
  # 每日重置小时，按固定 UTC+8 时区计算。0 表示每天 00:00 重置。
  reset_hour_utc8: 0

# 自助账号能力配置。
self_service:
  discord:
    # 默认关闭；开启前需要先在管理后台创建启用的用户组，并把该组固定 ID 填入 default_group_id。
    enabled: false
    # Discord Developer Portal 中的 OAuth2 Client ID。
    client_id: ""
    # Discord OAuth2 Client Secret。只填写在本地 config.yaml，不能提交。
    client_secret: ""
    # Discord OAuth2 Redirect URI，必须与 Developer Portal 中登记的地址完全一致。
    redirect_uri: "http://127.0.0.1:8080/auth/discord/callback"
    # 允许自助注册的 Discord 服务器 ID（Guild ID），不是频道 ID 或角色 ID。
    required_guild_id: ""
    # 本地 user_groups.id。启用 Discord 自助注册时必须指向一个存在且启用的用户组。
    default_group_id:
    # 自助登录 session 签名密钥。生产环境请使用高强度随机字符串，不能提交真实值。
    session_secret: ""

# 兼容旧配置的日志级别字段。
# 如果没有配置下面的 logging.level，程序会使用该值初始化日志级别。
# 建议新配置优先使用 logging.level。
log_level: INFO

# 应用日志和调试归档配置。
logging:
  # 日志级别，可选 DEBUG、INFO、ERROR。
  # DEBUG 会记录完整请求参数，便于排查问题；生产环境可使用 INFO。
  level: INFO
  # 日志和生成图片归档的根目录。默认 logs/ 已被 .gitignore 忽略。
  directory: logs
  # 应用文本日志文件名，最终路径为 logs/novelai_proxy.log。
  request_log_file: novelai_proxy.log
  # 是否把成功生成接口返回的 zip 内容解包保存到本地，便于 debug。
  save_generated_images: true
  # 生成图片归档目录名，最终路径为 logs/generated_images/{request_id}/。
  generated_images_dir: generated_images

# 上游生图输出格式策略。用户图片格式策略选择“跟随全局”时，使用这里的配置。
# 项目不再在本地转换 zip 内图片格式，而是通过 NovelAI 官方 parameters.image_format 控制上游输出。
image_format:
  # request：尊重请求中的 parameters.image_format，未传则不注入。
  # force：强制覆盖请求中的 parameters.image_format 为下面的 format。
  mode: request
  # 强制模式下使用的目标格式，可选 png、jpeg、webp。
  format: webp

# 图床上传配置。
# 默认关闭；开启后会在成功生成图片后，把 zip 内图片上传到图床，并把返回 URL 写入 usage_logs.image_urls。
image_hosting:
  enabled: false
  # 当前仅支持 catbox；后续新增平台时会通过该字段选择。
  provider: catbox
  # 上传请求超时时间，单位秒。
  timeout_seconds: 30
  # 后台待上传任务上限；达到上限时跳过本次图床上传，只保留本地输出和日志。0 表示不限制。
  max_pending_uploads: 50
  # 是否在上传到图床前，先在本地把图片转换为 local_conversion_format。
  # 只影响图床上传内容，不改变返回给用户的 NovelAI 原始 zip。
  local_format_conversion: false
  # 本地转换目标格式，可选 png、jpeg、webp。
  local_conversion_format: webp
  catbox:
    # Catbox 官方 API 入口。
    api_url: https://catbox.moe/user/api.php
    # Catbox 用户 hash。启用图床上传时必须填写。
    userhash: ""

# 浏览器跨域 CORS 配置。
# 当前项目主要使用 Authorization: Bearer <proxy_api_key> 鉴权；
# 这种模式通常可以使用 allow_origins: ["*"] 且 allow_credentials: false。
cors:
  # 是否启用 CORS 响应头和 OPTIONS 预检处理。
  enabled: true
  # 允许访问代理 API 的网页来源。
  # 开发时可以使用 "*"；生产环境建议改成明确域名，例如：
  # - "https://your-web.example.com"
  # - "http://localhost:3000"
  allow_origins:
    - "*"
  # 可选：用正则匹配允许的来源。
  # 为空表示不使用正则；如果配置正则，仍可同时保留 allow_origins。
  allow_origin_regex:
  # 允许的 HTTP 方法。"*" 表示允许常见方法。
  allow_methods:
    - "*"
  # 允许的请求头。
  # 前端带 Authorization 和 Content-Type 时需要允许这些头；"*" 表示全部允许。
  allow_headers:
    - "*"
  # 允许浏览器 JavaScript 读取的响应头。
  # Content-Disposition 用于前端读取 zip 下载文件名。
  expose_headers:
    - Content-Disposition
  # 是否允许浏览器携带 cookie、HTTP Basic 等凭证。
  # 如果改为 true，allow_origins 不能使用 "*"，必须写明确来源。
  allow_credentials: false
  # CORS 预检请求缓存时间，单位秒。
  max_age: 600
