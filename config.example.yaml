admin:
  username: admin
  password: change-me
server:
  host: 0.0.0.0
  port: 8080
queue:
  max_concurrent_upstream: 1
  max_queue_size: 50
novelai:
  api_key: ""
  account_tier: 3
  upscale_anlas_cost: 0
database:
  path: novelai_proxy.db
log_level: INFO
logging:
  level: INFO
  directory: logs
  request_log_file: novelai_proxy.log
  save_generated_images: true
  generated_images_dir: generated_images
cors:
  enabled: true
  allow_origins:
    - "*"
  allow_origin_regex:
  allow_methods:
    - "*"
  allow_headers:
    - "*"
  expose_headers:
    - Content-Disposition
  allow_credentials: false
  max_age: 600
